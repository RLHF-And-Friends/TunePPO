# Baseline: no similarity reward, only answer correctness.
# Based on llama_3.1_8b_ruletaker_dev.yaml.
#
# To launch: tune run --nproc_per_node N receipts/ppo/ppo.py --config receipts/ppo/configs/multihop/one_hop/llama_3.1_8b_ruletaker_baseline.yaml
#
# export OPENAI_API_KEY=<your API key>

prefix: ~/.tune

project: MULTIHOP
group: Llama-3.1-8B-Instruct-GRPO
model: Llama-3.1-8B-Instruct
run: ruletaker-dev-baseline

output_dir: ${prefix}/checkpoints/${project}/${group}/${model}-${run}

seed: 0xD1CE

empty_cache_after_generation: True

# ---------------------------------- Data ----------------------------------- #

tokenizer:
  _component_: ppotune.tokenizers.hf_tokenizer
  path: ${prefix}/models/${model}/
  pad_token: <|finetune_right_pad_id|>
  max_seq_len: 2500

dataset:
  _component_: ppotune.data.sets.rultaker_dataset
  source: VavGreg/wikidata_b21_dataset
  name: ruletaker_dev
  split: train
  token: true

dataloader:
  _component_: ppotune.data.loaders.distributed_dataloader
  batch_size: 64
  group_size: 8
  num_steps: 50
  num_epochs: 3

evaluator:
  _component_: ppotune.evaluation.empty_evaluator

# PPO Optimization Batch Parameters
ppo_epochs: 2
ppo_batch_size: 32
gradient_accumulation_steps: 4
forward_batch_size: 8

# --------------------------------- Policy ---------------------------------- #

policy:
  _component_: ppotune.model.GenerativeLoRAModel
  generation_batch_size: ${forward_batch_size}
  max_response_len: 512
  temperature: 0.5
  top_k: null
  model:
    _component_: torchtune.models.llama3_1.lora_llama3_1_8b
    lora_attn_modules: ['q_proj', 'k_proj', 'v_proj', 'output_proj']
    apply_lora_to_mlp: True
    apply_lora_to_output: False
    lora_rank: 64
    lora_alpha: 16
    lora_dropout: 0.0
    quantize_base: False
  ckpt:
    _component_: torchtune.training.FullModelHFCheckpointer
    checkpoint_dir: ${prefix}/models/${model}/
    checkpoint_files:
      [
        "model-00001-of-00004.safetensors",
        "model-00002-of-00004.safetensors",
        "model-00003-of-00004.safetensors",
        "model-00004-of-00004.safetensors"
      ]
    recipe_checkpoint: null
    output_dir: ${output_dir}/policy
    model_type: LLAMA3

# ---------------------------- Advantage Model ------------------------------ #
# Baseline: similarity_reward=0 — reward only for correct entailment/not entailment.

advantage:
  _component_: ppotune.advantage.GRAE
  group_size: ${dataloader.group_size}
  reward:
    _component_: ppotune.reward.GraphMultihopQAReward
    entity_aliases_filepath: ~/TunePPO/KG/KG_mquake_filtered/wikidata5m_entity.txt
    relation_aliases_filepath: ~/TunePPO/KG/KG_mquake_filtered/wikidata5m_relation.txt
    dataset_filepath: ~/TunePPO/KG/KG_mquake_filtered/wikidata5m_transductive_train.txt
    triplets_prompt_filepath: ~/TunePPO/KG/generate_triplets_prompt.txt
    entity_description_filepath: ~/TunePPO/KG/KG_mquake_filtered/wikidata5m_text.txt
    llm_selector_prompt_filepath: ~/TunePPO/KG/select_description_prompt.txt
    base_url: https://api.deepinfra.com/v1/openai
    triplets_model: Qwen/Qwen2.5-72B-Instruct
    llm_selector_model: Qwen/Qwen2.5-72B-Instruct
    norm_lev_threshold: 0.05
    temperature: 0.2
    graph_mode: no_info
    format_penalty_reward: 5
    reasoning_length_penalty_reward: 0
    min_reasoning_length: 100
    answer_length_penalty_reward: 5
    min_answer_length: 5
    similarity_reward: 0

# ---------------------------- Reference Model ------------------------------ #

reference:
  _component_: ppotune.comm.distributed_policy_mixture
  update_every_n_steps: 1000
  protocol:
    _component_: ppotune.comm.static_protocol
    weightage:
      _component_: ppotune.comm.uniform_weightage
      self_preference: 1.0

# --------------------------------- Other ---------------------------------- #

optimizer:
  _component_: bitsandbytes.optim.PagedAdamW
  lr: 1e-4

dtype: bf16

kl_penalty:
  _component_: ppotune.loss.KLPenalty
  coeff: 0.1

# PPO Loss
epsilon: 0.2

# Logging
wandb_logger:
  dir: ${prefix}
  entity: RADFAN
  project: ${project}
  group: ${group}
  name: ${model}-${run}

disk_logger:
  log_dir: /data/users/vasgreg/TunePPO/logs/
  filename: completions-${model}-${run}
